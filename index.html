<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGRO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    min-height:100vh;

    background: linear-gradient(
        135deg,
        #dcedc8 0%,
        #aed581 25%,
        #81c784 50%,
        #4caf50 75%,
        #2e7d32 100%
    );

    background-attachment: fixed;
}

h1{
    text-align:center;
    color:#1B5E20;
    font-size:42px;
    margin:30px 0;
    text-shadow:2px 2px 6px rgba(255,255,255,0.8);
    letter-spacing:2px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:40px auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}

.card{
    background:rgba(255,255,255,0.80);
    backdrop-filter:blur(8px);
    border-radius:20px;
    text-decoration:none;
    color:#222;
    padding:30px;

    display:flex;
    flex-direction:column;
    align-items:center;

    box-shadow:0 10px 25px rgba(0,0,0,.25);

    transition:.35s;
}

.card img{
    width:130px;
    height:130px;
    object-fit:contain;
    margin-bottom:18px;
}

.card p{
    font-size:20px;
    font-weight:bold;
    text-align:center;
}

@media (max-width:768px){

h1{
    font-size:30px;
}

.card img{
    width:100px;
    height:100px;
}

.card p{
    font-size:17px;
}

}
</style>

</head>

<body>

<h1>Welcome</h1>

<div class="container">

    <a href="FOUR3.html" class="card" target="_blank">
        <img src="6.gif" alt="Mail">
        <p>Redirect to Mail</p>
    </a>

    <a href="DISTRICTS.html" class="card" target="_blank">
        <img src="10.gif" alt="District Selector">
        <p>District Selector</p>
    </a>

    <a href="IbfHeatwave.html" class="card" target="_blank">
        <img src="hwave.png" alt="Heatwave">
        <p>IBF Heatwave & Heavy Rainfall</p>
    </a>

</div>

</body>
</html>
